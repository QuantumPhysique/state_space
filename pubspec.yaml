name: state_space
description: >-
  Gaussian process regression for irregular time series: smoothed trends with
  uncertainty bands, forecasts and learned hyperparameters, in linear time.
  Pure Dart.
version: 0.1.0
repository: https://github.com/QuantumPhysique/state_space
issue_tracker: https://github.com/QuantumPhysique/state_space/issues

screenshots:
  - description: Smoothed trend with its 95% credible band across a gap, and a forecast
    path: doc/images/trend.png

topics:
  - machine-learning
  - gaussian-process
  - time-series
  - statistics
  - kalman-filter

environment:
  sdk: ^3.9.0

dev_dependencies:
  benchmark_harness: ^2.3.1
  lints: ^5.1.0
  matrices: ^2.0.0 # dense reference implementation for the tests
  test: ^1.26.0
